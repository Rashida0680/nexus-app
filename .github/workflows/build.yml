name: Fabrication Mobile NEXUS
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Recuperation du code NEXUS
        uses: actions/checkout@v4
      - name: Configuration de l'environnement Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assemblage du paquet d'installation pour iPhone
        run: |
          pip install --quiet kivy-ios
          # Création du dossier d'application iOS officiel
          toolchain create "NEXUS"
          toolchain build "NEXUS"
      - name: Envoi du fichier vers TestFlight
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Application-iPhone
          path: build/nexus/*.ipa
